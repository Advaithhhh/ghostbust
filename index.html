<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostbust.tech</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load React and Babel for JSX transpilation -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide icons are now used via a simple SVG rendering strategy -->
    <style>
      /* Ensure the application container fills the viewport */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
      // Lucide icons are included in the source code using a simplified direct import method 
      // but since we can't use imports here, we'll redefine the necessary utility functions and use the Lucide icon library via SVGs

      const { useState, useMemo } = React;
      const { createRoot } = ReactDOM;

      // Define Lucide components (simplified inline SVG definition used in the component logic)
      const Upload = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
      const Users = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
      const Search = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>;
      const AlertCircle = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
      const CheckCircle2 = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
      const ArrowRight = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
      const ShieldCheck = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>;
      const HelpCircle = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>;
      const Ghost = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 10H7a4 4 0 0 0 0 8h2"/><path d="M15 10h2a4 4 0 0 1 0 8h-2"/><path d="M10 2h4l.5 2.5c.2 1.5 1.5 2.5 3 2.5h1.5a2 2 0 0 1 2 2.5c0 .3-.1.6-.2.9L22 17c0 2-1 3-3 3H5c-2 0-3-1-3-3l-.5-6c-.1-.3 0-.6.1-.9a2 2 0 0 1 2-2.5h1.5c1.5 0 2.8-1 3-2.5L10 2Z"/><path d="M10 16.5A.5.5 0 0 0 9.5 16h-1"/><path d="M16 16.5a.5.5 0 0 0 .5-.5h1"/><path d="M14 16.5A.5.5 0 0 0 13.5 16h-1"/></svg>;
      const X = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
      const ExternalLink = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>;
      
      const Card = ({ children, className = "" }) => (
        <div className={`bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-white/20 overflow-hidden ${className}`}>
          {children}
        </div>
      );

      const Badge = ({ children, color = "indigo" }) => {
        const colors = {
          indigo: "bg-indigo-100 text-indigo-700 border-indigo-200",
          rose: "bg-rose-100 text-rose-700 border-rose-200",
          emerald: "bg-emerald-100 text-emerald-700 border-emerald-200",
          sky: "bg-sky-100 text-sky-700 border-sky-200",
        };
        return (
          <span className={`px-3 py-1 rounded-full text-xs font-bold border ${colors[color] || colors.indigo}`}>
            {children}
          </span>
        );
      };

      function GhostbustTech() {
        const [followersData, setFollowersData] = useState(null);
        const [followingData, setFollowingData] = useState(null);
        const [followersFileName, setFollowersFileName] = useState("");
        const [followingFileName, setFollowingFileName] = useState("");
        const [error, setError] = useState("");
        const [activeTab, setActiveTab] = useState('ghosts');
        const [searchQuery, setSearchQuery] = useState("");
        const [isProcessing, setIsProcessing] = useState(false);

        // --- File Parsing Logic (Unchanged from OneFile.jsx) ---
        const extractUsernames = (content, type) => {
          const usernames = new Set();
          
          const isUsername = (str) => {
            if (!str || typeof str !== 'string') return false;
            const cleaned = str.trim();
            const lower = cleaned.toLowerCase();
            const blocklist = [
              'instagram', 'profile', 'home', 'search', 'settings', 'activity', 'saved', 
              'your story', 'switch accounts', 'log out', 'cancel', 'share', 'edit profile',
              'instagram user', 'instagrammer', 'meta'
            ];
            if (blocklist.includes(lower)) return false;
            return /^[a-zA-Z0-9._]{1,50}$/.test(cleaned);
          };

          const addUsername = (val) => {
            if (isUsername(val)) usernames.add(val.trim());
          };

          try {
            if (typeof content === 'string' && (content.trim().startsWith('{') || content.trim().startsWith('['))) {
              const json = JSON.parse(content);
              const findInJson = (obj) => {
                if (!obj) return;
                if (Array.isArray(obj)) { obj.forEach(item => findInJson(item)); return; }
                if (typeof obj === 'object') {
                  if (obj.string_list_data && Array.isArray(obj.string_list_data)) {
                    obj.string_list_data.forEach(item => { if (item.value) addUsername(item.value); });
                  }
                  if (obj.value && typeof obj.value === 'string') addUsername(obj.value);
                  if (obj.title && typeof obj.title === 'string') addUsername(obj.title);
                  Object.values(obj).forEach(val => findInJson(val));
                }
              };
              findInJson(json);
              if (usernames.size > 0) return usernames;
            }
          } catch (e) {}

          try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(content, 'text/html');
            const links = doc.querySelectorAll('a');
            links.forEach(link => {
              const href = link.getAttribute('href');
              const text = link.textContent;
              if (href && (href.includes('instagram.com') || href.startsWith('/'))) {
                if (text && isUsername(text)) addUsername(text);
                else if (href.includes('instagram.com/')) {
                  const match = href.match(/instagram\.com\/([a-zA-Z0-9._]+)/);
                  if (match && match[1]) addUsername(match[1]);
                }
              }
            });
          } catch (e) {}

          if (usernames.size === 0) {
            const matches = content.matchAll(/instagram\.com\/([a-zA-Z0-9._]+)/g);
            for (const match of matches) {
              if (match[1]) addUsername(match[1]);
            }
          }

          return usernames;
        };

        const handleFileUpload = (event, type) => {
          const file = event.target.files[0];
          if (!file) return;
          setIsProcessing(true);
          setError("");
          const reader = new FileReader();
          reader.onload = (e) => {
            const content = e.target.result;
            const extracted = extractUsernames(content, type);
            if (extracted.size === 0) {
              setError(`Could not find any usernames in the ${type} file. Please ensure it's a valid Instagram export.`);
              setIsProcessing(false);
              return;
            }
            if (type === 'followers') {
              setFollowersData(extracted);
              setFollowersFileName(file.name);
            } else {
              setFollowingData(extracted);
              setFollowingFileName(file.name);
            }
            setIsProcessing(false);
          };
          reader.readAsText(file);
        };

        // --- Analysis Logic (Unchanged) ---
        const stats = useMemo(() => {
          if (!followersData || !followingData) return null;
          const followersRaw = Array.from(followersData);
          const followingRaw = Array.from(followingData);
          const followersLowerSet = new Set(followersRaw.map(u => u.toLowerCase()));
          const followingLowerSet = new Set(followingRaw.map(u => u.toLowerCase()));

          const ghosts = followingRaw.filter(user => !followersLowerSet.has(user.toLowerCase()));
          const fans = followersRaw.filter(user => !followingLowerSet.has(user.toLowerCase()));
          const mutual = followingRaw.filter(user => followersLowerSet.has(user.toLowerCase()));

          return { ghosts, fans, mutual, totalFollowers: followersRaw.length, totalFollowing: followingRaw.length };
        }, [followersData, followingData]);

        const filteredList = useMemo(() => {
          if (!stats) return [];
          const list = stats[activeTab];
          if (!searchQuery) return list;
          return list.filter(user => user.toLowerCase().includes(searchQuery.toLowerCase()));
        }, [stats, activeTab, searchQuery]);

        // --- Components (Unchanged) ---
        const UploadBox = ({ title, type, fileName, count }) => {
          const isComplete = !!fileName;
          return (
            <div className="flex flex-col gap-3 w-full">
              <div className={`
                relative group border-2 border-dashed rounded-2xl p-8 transition-all duration-300 ease-out text-center overflow-hidden
                ${isComplete 
                  ? 'border-emerald-400 bg-emerald-50/50 shadow-[0_0_20px_rgba(16,185,129,0.1)]' 
                  : 'border-slate-300 bg-white/50 hover:border-indigo-400 hover:bg-indigo-50/30 hover:shadow-lg hover:scale-[1.01]'
                }
              `}>
                <input 
                  type="file" 
                  accept=".json,.html,.htm"
                  onChange={(e) => handleFileUpload(e, type)}
                  className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20"
                />
                
                <div className="flex flex-col items-center gap-3 relative z-10">
                  {isComplete ? (
                    <>
                      <div className="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">
                        <CheckCircle2 className="w-6 h-6 text-emerald-600" />
                      </div>
                      <div className="space-y-1">
                        <div className="text-sm font-bold text-emerald-900 break-all px-4">{fileName}</div>
                        <div className="text-xs font-semibold text-emerald-600 bg-emerald-100/50 px-3 py-1 rounded-full inline-block">
                          {count.toLocaleString()} accounts
                        </div>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center transition-colors ${type === 'followers' ? 'bg-indigo-100 group-hover:bg-indigo-200' : 'bg-violet-100 group-hover:bg-violet-200'}`}>
                        {type === 'followers' ? (
                          <Users className="w-6 h-6 text-indigo-600" />
                        ) : (
                          <ArrowRight className="w-6 h-6 text-violet-600" />
                        )}
                      </div>
                      <div className="space-y-1">
                        <div className="text-base font-bold text-slate-700">Upload {title}</div>
                        <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">JSON or HTML</div>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          );
        };

        return (
          <div className="min-h-screen bg-[#f8fafc] text-slate-900 font-sans selection:bg-indigo-100 selection:text-indigo-900 relative overflow-x-hidden">
            
            {/* Background Ambient Gradients */}
            <div className="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
              <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-200/30 rounded-full blur-[120px]" />
              <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-violet-200/30 rounded-full blur-[120px]" />
            </div>

            <div className="max-w-5xl mx-auto px-6 py-12 relative z-10">
              
              {/* Header */}
              <header className="text-center space-y-6 mb-16">
                <div className="inline-flex items-center justify-center gap-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-100 mb-4">
                  <div className="bg-indigo-600 p-2 rounded-xl text-white">
                    <Ghost className="w-6 h-6" />
                  </div>
                  <h1 className="text-3xl font-extrabold tracking-tight text-slate-900">
                    ghostbust.tech
                  </h1>
                </div>
                <p className="text-slate-500 text-lg max-w-xl mx-auto leading-relaxed">
                  Instantly reveal who follows you and who doesn't. <br/>
                  <span className="text-indigo-600 font-medium flex items-center justify-center gap-1 mt-2 text-sm">
                    <ShieldCheck className="w-4 h-4" /> Secure, client-side processing.
                  </span>
                </p>
              </header>

              {/* Upload Section */}
              <section className="mb-12 animate-in fade-in slide-in-from-bottom-4 duration-700">
                <div className="grid md:grid-cols-2 gap-6">
                  <UploadBox title="Followers" type="followers" fileName={followersFileName} count={followersData?.size} />
                  <UploadBox title="Following" type="following" fileName={followingFileName} count={followingData?.size} />
                </div>
                
                {error && (
                  <div className="mt-6 p-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl flex items-start gap-3 text-sm shadow-sm">
                    <AlertCircle className="w-5 h-5 shrink-0 mt-0.5" />
                    <div>
                      <p className="font-semibold">Parsing Error</p>
                      <p>{error}</p>
                    </div>
                  </div>
                )}
                
                {isProcessing && (
                  <div className="mt-6 flex justify-center">
                    <div className="bg-white/80 backdrop-blur px-6 py-3 rounded-full shadow-lg border border-indigo-100 flex items-center gap-3 text-indigo-600 font-medium text-sm animate-pulse">
                      <div className="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin" />
                      Processing files...
                    </div>
                  </div>
                )}
              </section>

              {/* Results Section */}
              {stats && (
                <main className="space-y-8 animate-in fade-in slide-in-from-bottom-8 duration-700 delay-100">
                  
                  {/* Big Stats Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {[
                      { id: 'ghosts', label: "The Ghosts", sub: "Don't Follow Back", count: stats.ghosts.length, color: 'rose', icon: Ghost },
                      { id: 'fans', label: "The Fans", sub: "You Don't Follow", count: stats.fans.length, color: 'emerald', icon: Users },
                      { id: 'mutual', label: "The Real Ones", sub: "Mutual Friends", count: stats.mutual.length, color: 'indigo', icon: ShieldCheck }
                    ].map((item) => (
                      <button 
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`
                          relative overflow-hidden p-6 rounded-2xl border text-left transition-all duration-300 group
                          ${activeTab === item.id 
                            ? 'bg-white shadow-xl scale-[1.02] border-indigo-200 ring-4 ring-indigo-50/50' 
                            : 'bg-white/60 hover:bg-white border-transparent hover:border-indigo-100 hover:shadow-lg'
                          }
                        `}
                      >
                        <div className={`absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity text-${item.color}-600`}>
                          {item.icon({ className: "w-24 h-24 -mr-4 -mt-4" })}
                        </div>
                        <div className="relative z-10">
                          <div className={`text-sm font-bold uppercase tracking-wider mb-1 text-${item.color}-600`}>{item.sub}</div>
                          <div className="text-4xl font-extrabold text-slate-900 mb-2 tracking-tight">{item.count.toLocaleString()}</div>
                          <div className="text-slate-500 font-medium">{item.label}</div>
                        </div>
                      </button>
                    ))}
                  </div>

                  {/* Main List Card */}
                  <Card className="min-h-[600px] flex flex-col">
                    {/* Toolbar */}
                    <div className="p-6 border-b border-slate-100 bg-white flex flex-col md:flex-row md:items-center justify-between gap-4 sticky top-0 z-20">
                      <div className="flex items-center gap-3">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                          {activeTab === 'ghosts' && "👻 Ghost Accounts"}
                          {activeTab === 'fans' && "🌟 Your Fans"}
                          {activeTab === 'mutual' && "🤝 Mutuals"}
                        </h2>
                        <Badge color={activeTab === 'ghosts' ? 'rose' : activeTab === 'fans' ? 'emerald' : 'indigo'}>
                          {filteredList.length}
                        </Badge>
                        
                        {activeTab === 'ghosts' && (
                          <div className="group relative flex items-center justify-center">
                            <HelpCircle className="w-4 h-4 text-slate-400 cursor-help hover:text-indigo-500 transition-colors" />
                            <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-3 w-64 p-3 bg-slate-900 text-white text-xs rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0 pointer-events-none z-50">
                              <strong>Why is this user here?</strong><br/>
                              Disabled accounts often vanish from your "Followers" list but stay in your "Following" list, causing false positives.
                              <div className="absolute bottom-[-6px] left-1/2 -translate-x-1/2 w-3 h-3 bg-slate-900 rotate-45"></div>
                            </div>
                          </div>
                        )}
                      </div>
                      
                      <div className="relative w-full md:w-72 group">
                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" />
                        <input
                          type="text"
                          placeholder="Search username..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                        />
                        {searchQuery && (
                          <button onClick={() => setSearchQuery("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <X className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    </div>

                    {/* List Content */}
                    <div className="flex-1 overflow-y-auto p-4 bg-slate-50/30">
                      {filteredList.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                          {filteredList.map((username, idx) => (
                            <div 
                              key={idx}
                              className="group bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all flex items-center justify-between"
                            >
                              <div className="flex items-center gap-3 overflow-hidden">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-50 to-slate-100 border border-slate-100 flex items-center justify-center text-indigo-500 font-bold text-sm shrink-0">
                                  {username.substring(0, 2).toUpperCase()}
                                </div>
                                <span className="font-medium text-slate-700 truncate">{username}</span>
                              </div>
                              
                              <a 
                                href={`https://www.instagram.com/${username}`} 
                                target="_blank" 
                                rel="noreferrer"
                                className="p-2 text-slate-300 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
                                title="View Profile"
                              >
                                <ExternalLink className="w-4 h-4" />
                              </a>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="h-full flex flex-col items-center justify-center py-20 text-slate-400">
                          <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                            <Ghost className="w-10 h-10 opacity-20" />
                          </div>
                          <p className="text-lg font-medium text-slate-500">No ghosts found here.</p>
                          <p className="text-sm">Try changing tabs or your search.</p>
                        </div>
                      )}
                    </div>
                  </Card>
                </main>
              )}
            </div>
          </div>
        );
      }

      // Initialize the React application
      const container = document.getElementById('root');
      const root = createRoot(container);
      root.render(<GhostbustTech />);

    </script>
</body>
</html>
